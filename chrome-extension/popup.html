<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Answer Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><img src="icons/icon-48.png" width="36" height="36" alt=""><div><strong>Answer Clipper</strong><span>ChatGPT 划词批注</span></div></header>
  <div class="stat"><span>本地收件箱</span><strong id="count">0 条</strong></div>
  <div class="stat"><span>默认文件</span><strong id="file">未设置</strong></div>
  <button id="settings" class="primary">设置默认 MD 文件</button>
  <button id="export">导出全部批注…</button>
  <p id="message" role="status"></p>
  <script src="popup.js"></script>
</body>
</html>
