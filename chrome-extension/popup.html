<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnyAnnotate</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><img src="icons/icon-48.png" width="36" height="36" alt=""><div><strong>AnyAnnotate</strong><span>Annotate text across the web</span></div></header>
  <div class="stat"><span>Local inbox</span><strong id="count">0 clips</strong></div>
  <div class="stat"><span>Save destination</span><strong id="file">Local inbox</strong></div>
  <button id="settings" class="primary">Configure Save Destinations</button>
  <label for="export-format">Export format</label>
  <select id="export-format">
    <option value="markdown">Markdown (.md)</option>
    <option value="txt">Plain text (.txt)</option>
  </select>
  <button id="export">Export Inbox…</button>
  <button id="google-export" hidden>Export Inbox to Google Docs</button>
  <button id="clear" class="danger">Clear Local Inbox…</button>
  <p id="message" role="status"></p>
  <script src="popup.js"></script>
</body>
</html>
