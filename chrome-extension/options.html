<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Answer Clipper 设置</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main>
    <header>
      <img src="icons/icon-128.png" width="64" height="64" alt="">
      <div><h1>Answer Clipper</h1><p>默认 Markdown 文件与隐私设置</p></div>
    </header>

    <section>
      <h2>默认保存文件</h2>
      <p>连接后，在 ChatGPT 页面点击“保存”即可把批注持续追加到这个文件。</p>
      <div class="file-row">
        <span id="file-name">尚未连接文件</span>
        <span id="permission" class="badge">未设置</span>
      </div>
      <div class="actions">
        <button id="choose" class="primary">选择或新建 MD 文件…</button>
        <button id="authorize" class="hidden">重新授权</button>
        <button id="disconnect" class="danger hidden">断开文件</button>
      </div>
      <p class="hint">Chrome 只会获得你主动选择的这一个文件的读写权限。文件权限失效时，批注仍会保存在插件本地收件箱。</p>
    </section>

    <section>
      <h2>本地收件箱</h2>
      <p>当前保存了 <strong id="count">0</strong> 条批注。它们仅存放在这台浏览器中。</p>
      <button id="export">导出全部为 MD…</button>
    </section>

    <section>
      <h2>隐私</h2>
      <p>Answer Clipper 不调用模型、不发送网络请求，也不把选中文字上传到服务器。数据只保存在浏览器本地或你选择的 Markdown 文件中。</p>
    </section>
    <div id="message" class="message hidden" role="status"></div>
  </main>
  <script src="options.js"></script>
</body>
</html>
